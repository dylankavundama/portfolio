<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Blog - Dylan Kavundama</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1><i class="fas fa-blog"></i> Administration du Blog</h1>
            <div class="admin-header-actions">
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Retour au site</a>
                <button class="btn-logout" onclick="logout()" title="Déconnexion">
                    <i class="fas fa-sign-out-alt"></i> Déconnexion
                </button>
            </div>
        </header>

        <div class="admin-content">
            <!-- Formulaire d'ajout -->
            <div class="admin-form-section">
                <h2><i class="fas fa-plus-circle"></i> Ajouter un article</h2>
                <form id="blog-form" class="blog-form">
                    <div class="form-group">
                        <label for="blog-image">
                            <i class="fas fa-image"></i> URL de l'image
                        </label>
                        <input type="url" id="blog-image" name="image" placeholder="https://example.com/image.jpg" required>
                        <small>Entrez l'URL complète de l'image</small>
                    </div>

                    <div class="form-group">
                        <label for="blog-title">
                            <i class="fas fa-heading"></i> Titre de l'article
                        </label>
                        <input type="text" id="blog-title" name="title" placeholder="Titre de votre article" required maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="blog-description">
                            <i class="fas fa-align-left"></i> Description
                        </label>
                        <textarea id="blog-description" name="description" rows="4" placeholder="Description de l'article..." required maxlength="500"></textarea>
                        <small id="char-count">0 / 500 caractères</small>
                    </div>

                    <div class="form-group">
                        <label for="blog-link">
                            <i class="fas fa-link"></i> Lien de l'article
                        </label>
                        <input type="url" id="blog-link" name="link" placeholder="https://example.com/article" required>
                        <small>Lien vers l'article complet</small>
                    </div>

                    <div class="form-group">
                        <label for="blog-date">
                            <i class="fas fa-calendar"></i> Date de publication
                        </label>
                        <input type="date" id="blog-date" name="date" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer l'article
                        </button>
                        <button type="reset" class="btn btn-secondary" id="reset-btn">
                            <i class="fas fa-redo"></i> Réinitialiser
                        </button>
                    </div>
                </form>
            </div>

            <!-- Liste des articles -->
            <div class="admin-list-section">
                <div class="section-header">
                    <h2><i class="fas fa-list"></i> Articles publiés (<span id="articles-count">0</span>)</h2>
                    <button class="btn btn-danger" id="clear-all-btn">
                        <i class="fas fa-trash"></i> Tout supprimer
                    </button>
                </div>

                <div class="articles-list" id="articles-list">
                    <!-- Les articles seront chargés ici -->
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
    <script src="admin.js"></script>
    <script>
        // Vérifier la session au chargement
        if (!checkSession()) {
            // Redirection gérée dans login.js
        }
    </script>
</body>
</html>
